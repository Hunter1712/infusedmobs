# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: common
            java: 25
            task: :common:build
          - project: 26.2
            java: 25
            task: :26.2:build
          - project: 1.21.1
            java: 21
            task: :1.21.1:build
          - project: 1.20.1
            java: 17
            task: :1.20.1:build
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build ${{ matrix.project }} (Java ${{ matrix.java }})
        run: ./gradlew ${{ matrix.task }} --info
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-Artifacts
          path: ${{ matrix.project }}/build/libs/

  aggregate:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Also validates that ./gradlew build from root builds all three overlays
      - name: build all overlays via root
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: capture all artifacts (combined)
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-all
          path: |
            26.2/build/libs/infusedmobs-*.jar
            1.21.1/build/libs/infusedmobs-*.jar
            1.20.1/build/libs/infusedmobs-*.jar
            !**/*-sources.jar
            !**/*-dev.jar
