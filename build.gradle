// Root aggregator — no code here. Each version subproject and `common` have their own build logic.
// This file exists to apply pluginManagement and ensure loom is available to subprojects without
// applying it to the root (which has no source).
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// Propagate mod version + group to all projects (version-specific projects override `version` with `+mc` suffix)
allprojects {
    group = project.findProperty('maven_group') ?: 'io.github.hunter1712'
}
